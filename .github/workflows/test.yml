name: "Test"

on: push

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node-version: [18, 20, 22]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install npm dependencies
        run: yarn -s install --frozen-lockfile --non-interactive

      - name: Run tests
        run: yarn -s dev-test

  self_test:
    strategy:
      matrix:
        node-version: [18, 20, 22]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install npm dependencies
        run: yarn -s install --frozen-lockfile --non-interactive

      - run: yarn alpha:build

      - name: Run self tests
        run: yarn -s alpha:test
